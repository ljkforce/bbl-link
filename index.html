<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e5e5ea;
      border-top-color: #007aff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    p  { font-size: 15px; color: #6e6e73; line-height: 1.5; }

    .store-links {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 28px;
    }

    .store-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .store-btn:hover { opacity: 0.85; }

    .store-btn.ios   { background: #000; color: #fff; }
    .store-btn.android { background: #01875f; color: #fff; }

    .store-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .divider {
      margin: 28px 0 0;
      border: none;
      border-top: 1px solid #e5e5ea;
    }

    .app-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .app-card {
      flex: 1;
      border: 1px solid #e5e5ea;
      border-radius: 12px;
      padding: 16px 12px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }

    .app-card:hover { background: #f5f5f7; }
    .app-card h2 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .app-card p  { font-size: 12px; color: #6e6e73; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Opening app…</h1>
    <p id="subtitle">You will be redirected automatically.</p>

    <!-- shown on desktop / fallback -->
    <div class="store-links" id="storeLinks">
      <a class="store-btn ios" id="iosLink" href="#">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        <span id="iosBtnLabel">Download on the App Store</span>
      </a>
      <a class="store-btn android" id="androidLink" href="#">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.37c1.33.07 2.22.72 3.06.74 1.17-.18 2.29-.89 3.53-.84 1.5.07 2.63.63 3.37 1.62-3.05 1.77-2.39 5.7.48 6.9-.56 1.55-1.3 3.09-2.44 4.49zM12 6.46c-.16-2.82 2.16-5.14 4.99-5.46.29 3.09-2.63 5.35-4.99 5.46z"/></svg>
        <span id="androidBtnLabel">Get it on Google Play</span>
      </a>
    </div>

    <!-- shown on desktop: both apps -->
    <div id="desktopSection" style="display:none">
      <hr class="divider" />
      <div class="app-row">
        <a class="app-card" id="desktopAppA" href="#">
          <h2 id="desktopAppAName">App A</h2>
          <p>Download</p>
        </a>
        <a class="app-card" id="desktopAppB" href="#">
          <h2 id="desktopAppBName">App B</h2>
          <p>Download</p>
        </a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    (function () {
      var cfg = window.APP_CONFIG;
      var fallback = cfg[cfg.fallbackApp];
      var ua = navigator.userAgent;
      var isIOS     = /iPhone|iPad|iPod/.test(ua);
      var isAndroid = /Android/.test(ua);

      function tryOpenApp(scheme, fallbackUrl) {
        var iframe = document.createElement("iframe");
        iframe.style.display = "none";
        document.body.appendChild(iframe);

        var start = Date.now();
        var timer = setTimeout(function () {
          document.removeEventListener("visibilitychange", onVisible);
          window.location.href = fallbackUrl;
        }, 1600);

        function onVisible() {
          if (document.hidden) return;
          if (Date.now() - start < 1800) {
            clearTimeout(timer);
            document.removeEventListener("visibilitychange", onVisible);
          }
        }

        document.addEventListener("visibilitychange", onVisible);
        iframe.src = scheme;
      }

      function showStoreLinks(iosUrl, androidUrl) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("title").textContent = "Get the app";
        document.getElementById("subtitle").textContent =
          "Download to continue.";

        var links = document.getElementById("storeLinks");
        links.style.display = "flex";

        var iosEl = document.getElementById("iosLink");
        var andEl = document.getElementById("androidLink");

        if (iosUrl)     { iosEl.href = iosUrl; }
        else            { iosEl.style.display = "none"; }

        if (androidUrl) { andEl.href = androidUrl; }
        else            { andEl.style.display = "none"; }
      }

      function showDesktop() {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("title").textContent = "Get the app";
        document.getElementById("subtitle").textContent =
          "Scan the QR code or pick your platform below.";

        var sec = document.getElementById("desktopSection");
        sec.style.display = "block";

        var aEl = document.getElementById("desktopAppA");
        var bEl = document.getElementById("desktopAppB");

        document.getElementById("desktopAppAName").textContent = cfg.appA.name;
        document.getElementById("desktopAppBName").textContent = cfg.appB.name;

        // Link to App Store on iOS, Play Store on Android, default to App Store
        aEl.href = cfg.appA.ios.storeUrl;
        bEl.href = cfg.appB.ios.storeUrl;
      }

      if (isIOS) {
        // Universal Link handled by OS when app is installed.
        // This page loads only when the app is NOT installed — redirect straight to App Store.
        window.location.href = fallback.ios.storeUrl;
        showStoreLinks(fallback.ios.storeUrl, null);

      } else if (isAndroid) {
        // Android App Link handled by OS when app is installed.
        // Try intent fallback, then redirect to Play Store.
        var intentUrl =
          "intent://" +
          location.host +
          location.pathname +
          "#Intent;scheme=https;package=" +
          fallback.android.packageName +
          ";S.browser_fallback_url=" +
          encodeURIComponent(fallback.android.storeUrl) +
          ";end";

        tryOpenApp(intentUrl, fallback.android.storeUrl);
        showStoreLinks(null, fallback.android.storeUrl);

      } else {
        // Desktop: show both apps
        showDesktop();
      }
    })();
  </script>
</body>
</html>
